name: Verify Fixed Point

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run one-liner
      run: |
        chmod +x solution_self_encode_2KB.sh
        sh solution_self_encode_2KB.sh
        echo "solution(s)=s self-encoding verified (E257 only)."
